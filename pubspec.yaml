name: trailscape
description: Kostenlose, local-first Gravel-Tracking-App - Aufzeichnen, Planen, Navigieren, Trainieren.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  http: ^1.5.0
  xml: ^6.6.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  wakelock_plus: ^1.3.3
  vibration: ^3.1.4
  share_plus: ^12.0.1
  file_picker: ^10.3.3
  intl: ^0.20.2
  health: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#264F3A"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  # Das Motiv liegt in icon_foreground.png bereits in der Safe-Zone
  # (zentrierter Kreis, ~66 % der Kantenlaenge) - kein zusaetzlicher Inset.
  adaptive_icon_foreground_inset: 0
