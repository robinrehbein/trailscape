name: Native Build

# Baut das native Android-Projekt (Kotlin + Compose) im Repo-Root. Laeuft
# bewusst nur bei Aenderungen an dessen Dateien, damit reine Flutter-Commits
# die Pipeline nicht doppelt beschaeftigen.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/native-build.yml"
  pull_request:
    paths:
      - "app/**"
      - "core/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/native-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Die GitHub-Ubuntu-Runner bringen das Android SDK mit (ANDROID_HOME ist
      # gesetzt); ein local.properties wird deshalb nicht gebraucht und darf
      # auch nicht existieren.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # `if: ${{ secrets.* }}` ist in GitHub Actions nicht erlaubt, darum die
      # Pruefung im Skript. Ohne Secret (z. B. PRs aus Forks) faellt der Build
      # bewusst auf die Debug-Signierung zurueck und bleibt gruen.
      - name: Signierschluessel bereitstellen
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"
            echo "RELEASE_KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore.jks" >> "$GITHUB_ENV"
            echo "Release-Signierung aktiv."
          else
            echo "Kein RELEASE_KEYSTORE_BASE64 hinterlegt — Build nutzt die Debug-Signierung."
          fi

      - name: Tests und Release-APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon :core:test :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: trailscape-native-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
