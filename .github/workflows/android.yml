name: Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - name: Abhängigkeiten
        run: flutter pub get

      - name: Analyse
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: APK bauen
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: trailscape-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Release aktualisieren
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Trailscape (aktuelle Version)
          body: |
            Automatischer Build vom letzten Stand auf `main`.

            **Installation:** `app-release.apk` herunterladen und auf dem
            Android-Gerät öffnen (Installation aus unbekannten Quellen erlauben).
          files: build/app/outputs/flutter-apk/app-release.apk
