name: Indoor-Welten (Katalog)

# Baut die Welten des Katalogs bekannter Strecken vor und haengt sie als
# Assets an das feste Release-Tag `indoor-worlds-v1` (docs/indoor/catalog.md).
#
# Nur manuell (workflow_dispatch): Ein Lauf dauert lange, laedt Geodaten von
# den Quellen des Weltbaus (Hoehen, OpenFreeMap, amtliche Luftbilder) und
# ersetzt veroeffentlichte Pakete. Die App laedt ein Paket erst, wenn jemand
# in der App „Laden" tippt; vorher fragt sie `catalog.json` aus demselben
# Release ab (Version, Groesse, SHA-256).
#
# Ablauf:
#  1. `catalog.json` des Release holen (falls vorhanden), damit ein Lauf mit
#     `only` die uebrigen Eintraege behaelt.
#  2. `:indoor-dev:installDist`, dann `catalog-build` (Bau, checkWorld, Paket).
#     Mit `preview_only` statt dessen die vorhandenen Pakete aus dem Release
#     holen (kein Neubau, keine Geodaten).
#  3. Vorschau je Strecke: `catalog-preview --prepare` legt die Welten bereit,
#     der Betrachter (`viewer/shots.mjs`, headless Chromium) rendert je Welt
#     ein JPEG (640 × 360, Ziel ≤ 150 kB), `catalog-preview` traegt Bild,
#     ausgeduenntes Hoehenprofil und Laser-Kennzeichen in catalog.json ein.
#     Scheitert ein Bild, bleibt die Strecke ohne Bild (die App zeigt dann
#     das Profil); der Lauf geht weiter.
#  4. Release anlegen, falls es fehlt, und Pakete, Vorschaubilder und
#     catalog.json hochladen (`--clobber` ersetzt gleichnamige Assets).
#
# Wer eine Strecke neu veroeffentlicht, erhoeht vorher ihre `version` in
# tool/indoor-dev/catalog/catalog-src.json (neuer Paketname, „Update
# verfuegbar" in der App).
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Nur diese Strecken (Kennungen mit Komma, leer = alle)"
        required: false
        default: ""
      quality:
        description: "Qualitaet (leer = je Eintrag, sonst LOW, MEDIUM, HIGH)"
        required: false
        default: ""
      preview_only:
        description: "Nur Vorschau erneuern (Bild, Profil, Laser) aus den Paketen des Release, ohne Neubau"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: indoor-worlds
  cancel-in-progress: false

env:
  TAG: indoor-worlds-v1

jobs:
  worlds:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # Das Modul :brouter uebersetzt das Submodul third_party/brouter; ohne es
      # bricht schon die Gradle-Konfiguration ab.
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Werkzeug bauen
        run: ./gradlew --no-daemon :indoor-dev:installDist

      - name: Bisherigen Katalog des Release holen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          gh release download "$TAG" --pattern catalog.json --dir out --clobber || echo "noch kein Release-Katalog"

      - name: Welten bauen, pruefen, packen
        if: ${{ !inputs.preview_only }}
        env:
          ONLY: ${{ inputs.only }}
          QUALITY: ${{ inputs.quality }}
        run: |
          args=(catalog-build --out out --keep-going)
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          if [ -n "$QUALITY" ]; then args+=(--quality "$QUALITY"); fi
          JAVA_OPTS="-Xmx6g" tool/indoor-dev/build/install/indoor-dev/bin/indoor-dev "${args[@]}"

      - name: Pakete des Release fuer die Vorschau holen
        if: ${{ inputs.preview_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.only }}
        run: |
          test -f out/catalog.json || { echo "kein Katalog im Release"; exit 1; }
          mkdir -p out/packages
          jq -r --arg only "$ONLY" '.entries[] | select($only == "" or (.id as $i | $only | split(",") | map(gsub("^ +| +$"; "")) | any(.[]; . == $i))) | .packageFile' out/catalog.json |
            while read -r pkg; do
              gh release download "$TAG" --pattern "$pkg" --dir out/packages --clobber || echo "::warning::$pkg fehlt im Release"
            done

      # Vorschau: Fehler hier kosten nur Bilder, nie die Pakete (continue-on-error).
      - uses: actions/setup-node@v6
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          node-version: "22"

      - name: Vorschau vorbereiten
        id: preview_prepare
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          ONLY: ${{ inputs.only }}
        run: |
          args=(catalog-preview --out out --prepare)
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          tool/indoor-dev/build/install/indoor-dev/bin/indoor-dev "${args[@]}"
          cd tool/indoor-dev/viewer
          npm ci
          # shots.mjs findet Playwright ueber require() vom Betrachter aus.
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Vorschaubilder rendern
        if: ${{ !cancelled() && steps.preview_prepare.outcome == 'success' }}
        continue-on-error: true
        run: |
          out="$PWD/out"
          while IFS=$'\t' read -r id ver dir dist; do
            [ -n "$id" ] || continue
            tmp="$out/previews/tmp-$id"
            rm -rf "$tmp"
            # Exit-Code ≠ 0 auch bei Warnungen (z. B. dunkler Wald): ein Bild gibt es trotzdem.
            node tool/indoor-dev/viewer/shots.mjs "$dir" --dists "$dist" --cameras chase \
              --size 960x540 --jpeg-width 640 --jpeg-max-kb 150 --out "$tmp" || echo "::warning::$id: Betrachter meldet Probleme"
            jpg=$(ls "$tmp"/*_chase.jpg 2>/dev/null | head -1)
            if [ -n "$jpg" ]; then mv "$jpg" "$out/previews/$id-v$ver.jpg"; else echo "::warning::$id: kein Vorschaubild"; fi
            rm -rf "$tmp"
          done < "$out/previews/plan.tsv"
          ls -l "$out/previews"

      - name: Vorschau in den Katalog eintragen
        if: ${{ !cancelled() && steps.preview_prepare.outcome == 'success' }}
        continue-on-error: true
        env:
          ONLY: ${{ inputs.only }}
        run: |
          args=(catalog-preview --out out)
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          tool/indoor-dev/build/install/indoor-dev/bin/indoor-dev "${args[@]}"

      - name: Uebersicht
        if: always()
        run: |
          ls -l out/packages || true
          cat out/catalog.json || true

      # Auch wenn einzelne Strecken scheiterten (--keep-going): die fertigen hochladen.
      - name: Release anlegen und Pakete hochladen
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_ONLY: ${{ inputs.preview_only }}
        run: |
          files=(out/catalog.json)
          if [ "$PREVIEW_ONLY" = "true" ]; then
            # Die Pakete liegen schon im Release; nur Bilder und Katalog.
            if ls out/packages/*.jpg > /dev/null 2>&1; then files+=(out/packages/*.jpg); fi
            gh release upload "$TAG" "${files[@]}" --clobber
            exit 0
          fi
          if ! ls out/packages/*.zip > /dev/null 2>&1; then echo "keine Pakete gebaut"; exit 1; fi
          files+=(out/packages/*.zip)
          if ls out/packages/*.jpg > /dev/null 2>&1; then files+=(out/packages/*.jpg); fi
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --prerelease --title "Indoor-Welten: bekannte Strecken" \
              --notes "Vorgebaute 3D-Welten fuer das Indoor-Training (Katalog bekannter Strecken). Die App laedt sie nur nach „Laden“. Quellenangaben stehen im manifest.json jeder Welt; Streckenverlauf © OpenStreetMap-Mitwirkende (ODbL). Siehe docs/indoor/catalog.md."
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
