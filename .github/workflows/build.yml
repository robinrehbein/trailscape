name: Build

# Baut, testet und veroeffentlicht die native Android-App (Kotlin + Compose).
# Seit dem Ende der Flutter-Aera der einzige Build-Workflow des Repositories,
# deshalb ohne Pfadfilter: es gibt keinen zweiten Quellbaum mehr, der einen
# separaten Lauf ausloesen koennte.
#
# Nur push-Trigger (kein pull_request): Push-Laeufe erscheinen ueber die
# Commit-SHA trotzdem als Checks am PR, und der doppelte Lauf pro Push auf
# den Entwicklungs-Branch entfaellt. Fork-PRs gibt es in diesem Solo-Repo nicht.
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # `submodules: true` ist Pflicht, nicht Bequemlichkeit: Das Modul
      # `:brouter` hat keinen eigenen Quellcode, sondern uebersetzt direkt
      # `third_party/brouter` (BRouter v1.7.10). Ohne das Submodul bricht
      # schon die Konfiguration von :brouter ab.
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Die GitHub-Ubuntu-Runner bringen das Android SDK mit (ANDROID_HOME ist
      # gesetzt); ein local.properties wird deshalb nicht gebraucht und darf
      # auch nicht existieren.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # `if: ${{ secrets.* }}` ist in GitHub Actions nicht erlaubt, darum die
      # Pruefung im Skript. Ohne Secret (z. B. PRs aus Forks) faellt der Build
      # bewusst auf die Debug-Signierung zurueck und bleibt gruen.
      - name: Signierschluessel bereitstellen
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"
            echo "RELEASE_KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore.jks" >> "$GITHUB_ENV"
            echo "Release-Signierung aktiv."
          else
            echo "Kein RELEASE_KEYSTORE_BASE64 hinterlegt — Build nutzt die Debug-Signierung."
          fi

      - name: Tests und Release-APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        # :app:testDebugUnitTest deckt die plattformfreien Teile von :app ab
        # (Aufzeichnungs-Journal); AGP legt Unit-Test-Tasks nur fuer die
        # Debug-Variante an, ein `:app:test` gaebe es sonst nicht.
        #
        # :wear:assembleRelease baut zusaetzlich den Wear-OS-Spike (Modul
        # `:wear`, siehe docs/wear-spike.md) mit. Er laeuft im selben
        # Gradle-Aufruf wie :app, bekommt also dieselben
        # RELEASE_KEYSTORE_PATH/RELEASE_KEYSTORE_PASSWORD-Umgebungsvariablen
        # zu sehen wie oben fuer :app — vorausgesetzt, wear/build.gradle.kts
        # liest sie genauso aus wie app/build.gradle.kts. Die
        # Signierkonfiguration selbst ist in AGP nicht modulueber-
        # greifend,
        # jedes Android-Modul braucht seinen eigenen signingConfigs-Block.
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:assembleRelease :wear:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: trailscape-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Die R8-Mapping-Datei ist die einzige Moeglichkeit, spaeter gemeldete
      # Stacktraces des minifizierten Builds zurueckzuuebersetzen. Sie gehoert
      # nicht ins Release (Downloadseite), aber sehr wohl in die Artefakte.
      - uses: actions/upload-artifact@v4
        with:
          name: trailscape-mapping
          path: app/build/outputs/mapping/release/
          if-no-files-found: error

      # Wear-OS-Spike (siehe docs/wear-spike.md): eigenes, klar unterscheidbares
      # Artefakt statt ein Release-Asset. Der Spike kommt ausschliesslich per
      # ADB auf ein Entwicklergeraet (adb install) und ist nicht fuer normale
      # Nutzer installierbar — auf der Releases-Seite (`latest`, `v2.0.x`)
      # wuerde eine Wear-APK also nur verwirren. Deshalb bewusst NUR hier als
      # Actions-Artefakt und NICHT im release-Job unten mit hochgeladen.
      - uses: actions/upload-artifact@v4
        with:
          name: trailscape-wear-apk
          path: wear/build/outputs/apk/release/wear-release.apk
          if-no-files-found: error

  # Veroeffentlicht bei jedem main-Push ZWEI Releases mit derselben APK:
  #
  #  * `latest` — der stabile Link
  #    https://github.com/<repo>/releases/download/latest/trailscape.apk,
  #    wird ueberschrieben. Der Update-Kanal, der schon zu Flutter-Zeiten galt.
  #  * `v2.0.<GITHUB_RUN_NUMBER>` — unveraenderlich, mit Changelog aus den
  #    Commit-Betreffs seit dem letzten solchen Tag. Ohne diese Tags koennte
  #    die App nicht feststellen, ob es etwas Neueres gibt: `latest` traegt
  #    keine Versionsnummer, und ein blosser Dateivergleich ist nicht
  #    moeglich.
  #
  # Branch-Pushes bauen und testen zwar, veroeffentlichen aber nichts.
  #
  # Absichtlich OHNE das Wear-Artefakt `trailscape-wear-apk`: Der Wear-OS-
  # Spike (Modul :wear, siehe docs/wear-spike.md) wird nur per `adb install`
  # auf ein Entwicklergeraet gebracht. Als Release-Asset waere er fuer
  # normale Nutzer nicht installierbar und wuerde auf der Releases-Seite nur
  # verwirren — dieser Job laedt darum weiterhin ausschliesslich
  # `trailscape-apk` herunter.
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Volle Historie inklusive Tags: Die Release-Notes des versionierten
      # Releases sind der `git log` seit dem letzten `v2.0.*`-Tag. Ohne
      # `fetch-depth: 0` kennt der Klon weder die alten Tags noch genug
      # Historie dafuer.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: trailscape-apk

      # Das unveraenderliche Gegenstueck zum `latest`-Alias: ein Release pro
      # main-Push, getaggt mit derselben Lauf-Nummer, die im versionCode und
      # im versionName der APK steckt (siehe app/build.gradle.kts). Erst
      # dadurch laesst sich ueberhaupt sagen, welche Version installiert ist
      # und ob es eine neuere gibt — der In-App-Update-Check
      # (app/src/main/kotlin/de/trailscape/app/update/) liest genau diese
      # Tags ueber die GitHub-API.
      - name: Versioniertes Release mit Changelog anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mv app-release.apk trailscape.apk

          tag="v2.0.${GITHUB_RUN_NUMBER}"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag existiert bereits (Wiederholungslauf) — bleibt unveraendert."
            exit 0
          fi

          # Das zuletzt veroeffentlichte Versions-Tag. `-v:refname` sortiert
          # numerisch, sonst stuende v2.0.9 hinter v2.0.10. Der Alias-Tag
          # `latest` passt auf das Muster nicht und stoert deshalb nicht.
          last_tag="$(git tag --list 'v2.0.*' --sort=-v:refname | head -n 1)"

          if [ -n "$last_tag" ]; then
            heading="Änderungen seit ${last_tag}:"
            changelog="$(git log --format='- %s' "${last_tag}..HEAD")"
            : "${changelog:=- Keine neuen Commits — unveränderter Stand, neu gebaut.}"
          else
            # Erster Lauf dieser Serie: Es gibt kein Vorgaenger-Tag, also die
            # letzten Betreffzeilen als Anhaltspunkt.
            heading="Die letzten Änderungen:"
            changelog="$(git log --format='- %s' -n 10)"
          fi

          notes="$(cat <<EOF
          ${heading}

          ${changelog}

          **Installation:** \`trailscape.apk\` herunterladen und auf dem
          Android-Gerät öffnen (Installation aus unbekannten Quellen erlauben).
          Das Update legt sich über die bestehende Installation, die Touren
          bleiben erhalten.
          EOF
          )"

          # `--latest=false`: Die „Latest"-Markierung gehoert dem Alias-Release
          # `latest` — dessen Seite ist der stabile Download-Link, auf den die
          # App und das README verweisen. Dieses Release hier ist das Archiv
          # mit dem Changelog.
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Trailscape $tag" \
            --notes "$notes" \
            --latest=false \
            trailscape.apk

      - name: latest-Release aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Der vorige Schritt hat die APK schon umbenannt; bei einem
          # Wiederholungslauf, der dort vorzeitig aussteigt, ebenfalls.
          [ -f trailscape.apk ] || mv app-release.apk trailscape.apk

          # Den Tag `latest` auf den gerade gebauten Commit ziehen, damit das
          # Release nicht dauerhaft auf einen alten Stand zeigt.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
            -f sha="$GITHUB_SHA" -F force=true >/dev/null \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                 -f ref="refs/tags/latest" -f sha="$GITHUB_SHA" >/dev/null

          notes=$(cat <<'EOF'
          Automatisch gebaute APK vom aktuellen Stand auf `main`. Dieses
          Release wird bei jedem Push überschrieben und ist damit immer die
          neueste Version.

          **Installation:** `trailscape.apk` herunterladen und auf dem
          Android-Gerät öffnen (Installation aus unbekannten Quellen erlauben).

          **Was ist neu?** Jeder Stand liegt zusätzlich als unveränderliches
          Release `v2.0.<Nummer>` mit Changelog auf der
          [Releases-Seite](https://github.com/robinrehbein/trailscape/releases).
          Dieselbe Nummer zeigt die App unter *Mehr → Über*.

          > **Einmalig beim Umstieg von Version 1.x:** Version 2.x ist die
          > neu geschriebene native App und trägt einen neuen Signierschlüssel.
          > Sie lässt sich deshalb nicht als Update über die alte Installation
          > legen. Reihenfolge: in der alten App unter *Mehr → Daten & Backup →
          > Backup exportieren* eine Sicherung anlegen, die alte App
          > deinstallieren, diese APK installieren und die Sicherung unter
          > *Mehr → Daten & Backup → Backup importieren* einlesen. Danach sind
          > Updates wieder ganz normale Installationen darüber.
          EOF
          )

          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit latest --repo "$GITHUB_REPOSITORY" \
              --title "Trailscape" --notes "$notes" --latest
          else
            gh release create latest --repo "$GITHUB_REPOSITORY" \
              --title "Trailscape" --notes "$notes" --latest
          fi

          gh release upload latest trailscape.apk --clobber --repo "$GITHUB_REPOSITORY"

          # Altlast aus der Flutter-Pipeline: das Release trug die APK frueher
          # unter anderem Namen. Wegräumen, damit niemand versehentlich die
          # eingefrorene alte Version laedt. `|| true`, weil das Asset nach dem
          # ersten Lauf nicht mehr existiert.
          gh release delete-asset latest app-release.apk --yes --repo "$GITHUB_REPOSITORY" || true
